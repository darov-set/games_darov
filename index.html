<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ARCADE10</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg-deep:#0b0e1a;
  --bg-mid:#141830;
  --panel:#191d38;
  --line:rgba(255,255,255,0.08);
  --text:#f4f6fb;
  --sub:#9aa1c4;
  --cyan:#4ff3d6;
  --magenta:#ff4fa3;
  --amber:#ffc24f;
  --violet:#8f7bff;
  --danger:#ff5c6c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg-deep);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}
.blob{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0;opacity:.18;}
.blob1{width:380px;height:380px;top:-140px;left:-100px;background:var(--violet);}
.blob2{width:320px;height:320px;bottom:-160px;right:-120px;background:var(--cyan);}
#app{position:relative;z-index:1;}

/* ---------- SPLASH ---------- */
#splash{
  position:fixed;inset:0;z-index:50;overflow:hidden;
  background:
    radial-gradient(650px 650px at 15% 15%, rgba(143,123,255,.4), transparent 60%),
    radial-gradient(650px 650px at 85% 85%, rgba(79,243,214,.32), transparent 60%),
    var(--bg-deep);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .5s ease, visibility .5s ease;
}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
.splash-blob{position:absolute;border-radius:50%;filter:blur(75px);opacity:.5;animation:splashFloat 3.2s ease-in-out infinite alternate;}
.splash-blob.b1{width:260px;height:260px;top:-70px;left:-70px;background:var(--violet);}
.splash-blob.b2{width:240px;height:240px;bottom:-70px;right:-70px;background:var(--cyan);animation-delay:.5s;}
@keyframes splashFloat{0%{transform:translate(0,0) scale(1)}100%{transform:translate(24px,24px) scale(1.18)}}
.splash-mascots{position:absolute;inset:0;pointer-events:none;}
.mascot{position:absolute;width:50px;height:50px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45));animation:mascotFloat 2.6s ease-in-out infinite;}
.mascot svg{width:100%;height:100%;}
.mascot.m1{top:13%;left:10%;}
.mascot.m2{top:16%;right:9%;animation-delay:.45s;}
.mascot.m3{bottom:15%;left:11%;animation-delay:.9s;}
.mascot.m4{bottom:18%;right:10%;animation-delay:1.3s;}
@keyframes mascotFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(-4deg)}}
.splash-badge{
  width:88px;height:88px;border-radius:26px;position:relative;z-index:1;
  background:linear-gradient(145deg,var(--cyan),var(--violet) 55%,var(--magenta));
  display:flex;align-items:center;justify-content:center;font-size:40px;
  animation:pulseGlow 1.8s ease-in-out infinite;
}
@keyframes pulseGlow{0%,100%{box-shadow:0 14px 40px rgba(143,123,255,.4)}50%{box-shadow:0 16px 56px rgba(79,243,214,.55)}}
.splash-name{position:relative;z-index:1;font-size:23px;font-weight:800;letter-spacing:.2px;}
.splash-bar{position:relative;z-index:1;width:160px;height:4px;border-radius:4px;background:rgba(255,255,255,0.12);overflow:hidden;}
.splash-bar span{display:block;height:100%;width:0%;border-radius:4px;
  background:linear-gradient(90deg,var(--cyan),var(--violet),var(--magenta));
  animation:loadbar 1.7s ease forwards;}
@keyframes loadbar{0%{width:0%}70%{width:88%}100%{width:100%}}
.splash-pct{position:relative;z-index:1;font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.5px;}
.splash-auth{position:relative;z-index:1;font-size:12.5px;color:var(--sub);}
.splash-auth b{color:var(--amber);font-weight:700;}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 16px 22px;}

/* ---------- HEADER ---------- */
header.top{
  padding:20px 2px 16px;
  display:flex;align-items:center;gap:12px;
}
.head-badge{
  width:46px;height:46px;border-radius:14px;flex:none;
  background:linear-gradient(145deg,var(--cyan),var(--violet) 55%,var(--magenta));
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 6px 18px rgba(143,123,255,.3);
}
.head-text h1{
  margin:0;font-size:19px;font-weight:800;letter-spacing:-.2px;color:var(--text);
}
.head-text .tag{font-size:12.5px;color:var(--sub);margin-top:1px;}
.head-text .auth{font-size:11.5px;color:var(--sub);margin-top:2px;}
.head-text .auth a{color:var(--amber);text-decoration:none;font-weight:700;}

/* ---------- MENU GRID ---------- */
#menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.card{
  position:relative;background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;padding:14px;cursor:pointer;
  transition:transform .12s ease, border-color .15s ease;
}
.card:active{transform:scale(.96);}
.card:hover{border-color:rgba(255,255,255,0.16);}
.card .ico{
  width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  margin-bottom:12px;
}
.card .ico svg{width:26px;height:26px;display:block;}
.card h3{margin:0 0 3px;font-size:14.5px;font-weight:700;letter-spacing:-.1px;}
.card p{margin:0;font-size:11.5px;color:var(--sub);line-height:1.4;}

/* ---------- GAME VIEW ---------- */
#gameView{display:none;flex-direction:column;flex:1;padding-top:14px;}
.gtop{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.backBtn{
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;font-weight:700;
}
.gtitle{font-size:17px;font-weight:800;flex:1;}
.gscore{font-size:13px;color:var(--amber);font-weight:700;white-space:nowrap;}

.stage{
  position:relative;width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;
  aspect-ratio:3/4;
  display:flex;align-items:center;justify-content:center;
  touch-action:none;
  user-select:none;
}
.stage canvas{display:block;width:100%;height:100%;}
.hint{margin-top:10px;font-size:12.5px;color:var(--sub);text-align:center;}

.overlay{
  position:absolute;inset:0;background:rgba(11,14,26,0.86);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  text-align:center;padding:20px;z-index:5;
}
.overlay.show{display:flex;}
.overlay h2{margin:0;font-size:22px;}
.overlay p{margin:0;color:var(--sub);font-size:14px;}
.btn{
  background:linear-gradient(90deg,var(--cyan),var(--violet));
  color:#0b0e1a;border:none;border-radius:12px;padding:11px 22px;
  font-weight:800;font-size:14px;cursor:pointer;
}

/* generic DOM-grid game styles */
.gridwrap{display:grid;gap:8px;width:88%;height:88%;}
.cell{
  background:rgba(255,255,255,0.05);border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;cursor:pointer;user-select:none;
}

footer.credit{
  text-align:center;color:var(--sub);font-size:12px;margin-top:20px;padding-top:10px;
  border-top:1px solid var(--line);
}
footer.credit a{color:var(--cyan);text-decoration:none;font-weight:700;}
</style>
</head>
<body>
<div id="splash">
  <div class="splash-blob b1"></div>
  <div class="splash-blob b2"></div>
  <div class="splash-mascots">
    <div class="mascot m1"><svg viewBox="0 0 40 40"><path d="M6 32 Q4 20 14 20 Q24 20 24 10 Q24 4 17 4" stroke="#4ff3d6" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="17" cy="4" r="2.6" fill="#4ff3d6"/></svg></div>
    <div class="mascot m2"><svg viewBox="0 0 40 40"><ellipse cx="19" cy="22" rx="13" ry="10" fill="#ffc24f"/><path d="M30 20 L38 22.5 L30 25 Z" fill="#ff8f3d"/><circle cx="26" cy="18" r="2.3" fill="#0b0e1a"/></svg></div>
    <div class="mascot m3"><svg viewBox="0 0 40 40"><path d="M20 4 L26 24 L20 20 L14 24 Z" fill="#ff4fa3"/><path d="M17 22 L20 34 L23 22 Z" fill="#ffc24f"/></svg></div>
    <div class="mascot m4"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="12" fill="#b07a4c"/><circle cx="15" cy="18" r="2" fill="#0b0e1a"/><circle cx="25" cy="18" r="2" fill="#0b0e1a"/></svg></div>
  </div>
  <div class="splash-badge">🎮</div>

  <div class="splash-bar"><span></span></div>
  <div class="splash-pct" id="splashPct">0%</div>
  <div class="splash-auth">by <b>@TheDarov</b></div>
</div>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div id="app">

  <header class="top">
    <div class="head-badge">🎮</div>
    <div class="head-text">
      <h1>ARCADE10</h1>
      <div class="tag">10 игр в одном мини-приложении</div>
      <div class="auth">Автор — <a href="https://t.me/TheDarov" target="_blank">@TheDarov</a></div>
    </div>
  </header>

  <div id="menu"></div>

  <div id="gameView">
    <div class="gtop">
      <button class="backBtn" onclick="goMenu()">← Меню</button>
      <div class="gtitle" id="gTitle"></div>
      <div class="gscore" id="gScore"></div>
    </div>
    <div class="stage" id="stage">
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">Игра окончена</h2>
        <p id="ovText"></p>
        <button class="btn" id="ovBtn" onclick="restartCurrent()">Ещё раз</button>
      </div>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <footer class="credit">Сделано <a href="https://t.me/TheDarov" target="_blank">@TheDarov</a> · ARCADE10 mini app</footer>
</div>

<script>
/* ============ SPLASH SCREEN ============ */
window.addEventListener('load', ()=>{
  const pctEl=document.getElementById('splashPct');
  const t0=performance.now(), dur=1700;
  function tickPct(t){
    const p=Math.min(100, Math.round(((t-t0)/dur)*100));
    pctEl.textContent=p+'%';
    if(p<100) requestAnimationFrame(tickPct);
  }
  requestAnimationFrame(tickPct);
  setTimeout(()=>{
    const sp=document.getElementById('splash');
    sp.classList.add('hide');
    setTimeout(()=>sp.remove(), 600);
  }, dur);
});

/* ============ TELEGRAM WEBAPP (optional, safe if absent) ============ */
try{
  if(window.Telegram && window.Telegram.WebApp){
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }
}catch(e){}

/* ============ APP SHELL ============ */
const GAMES = [
  {id:'snake',   icon:'🐍', name:'Змейка',        desc:'Классика с ростом и ускорением', color:'--cyan'},
  {id:'2048',    icon:'🔢', name:'2048',           desc:'Собери плитку 2048', color:'--amber'},
  {id:'flappy',  icon:'🐤', name:'Флаппи Берд',    desc:'Лети между труб', color:'--magenta'},
  {id:'ttt',     icon:'❌', name:'Крестики-нолики',desc:'Против бота или онлайн с другом', color:'--violet'},
  {id:'memory',  icon:'🧠', name:'Память',         desc:'Найди пары карточек', color:'--cyan'},
  {id:'mole',    icon:'🔨', name:'Крот',           desc:'Успей ударить крота', color:'--amber'},
  {id:'breakout',icon:'🧱', name:'Арканоид',       desc:'Разбей все кирпичи', color:'--magenta'},
  {id:'shooter', icon:'🚀', name:'Космо-стрелок',  desc:'Уничтожай астероиды в полёте', color:'--violet'},
  {id:'runner',  icon:'🦖', name:'Раннер',         desc:'Прыгай через препятствия', color:'--cyan'},
  {id:'catch',   icon:'🍓', name:'Ловец фруктов',  desc:'Лови фрукты, избегай бомб', color:'--amber'},
];

/* Custom minimal monochrome icons per game (self-contained SVG — real photos can't be embedded in a published, self-contained page) */
const ICONS = {
  snake:`<svg viewBox="0 0 40 40" fill="none"><path d="M6 32 Q4 20 14 20 Q24 20 24 10 Q24 4 17 4" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="17" cy="4" r="2.6" fill="#fff"/></svg>`,
  '2048':`<svg viewBox="0 0 40 40"><rect x="5" y="9" width="30" height="22" rx="6" fill="none" stroke="#fff" stroke-width="2.2"/><text x="20" y="24" font-size="10" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial">2048</text></svg>`,
  flappy:`<svg viewBox="0 0 40 40"><ellipse cx="19" cy="22" rx="13" ry="10" fill="#fff"/><path d="M30 20 L38 22.5 L30 25 Z" fill="#fff"/><path d="M8 22 Q0 19 6 13 Q11 17 11 22 Z" fill="#fff" fill-opacity=".55"/></svg>`,
  ttt:`<svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round"><line x1="14" y1="5" x2="14" y2="35"/><line x1="26" y1="5" x2="26" y2="35"/><line x1="5" y1="14" x2="35" y2="14"/><line x1="5" y1="26" x2="35" y2="26"/><line x1="6" y1="6" x2="12" y2="12"/><line x1="12" y1="6" x2="6" y2="12"/><circle cx="31" cy="31" r="4"/></svg>`,
  memory:`<svg viewBox="0 0 40 40"><rect x="4" y="10" width="15" height="21" rx="3" fill="#fff" fill-opacity=".5"/><rect x="21" y="7" width="16" height="24" rx="3" fill="#fff"/><path d="M27 22 l2-5 2 5 5 1-5 2-2 5-2-5-5-2 5-1z" fill="#141830"/></svg>`,
  mole:`<svg viewBox="0 0 40 40"><ellipse cx="20" cy="32" rx="16" ry="4" fill="#fff" fill-opacity=".3"/><circle cx="20" cy="20" r="12" fill="#fff"/><circle cx="15" cy="18" r="2" fill="#141830"/><circle cx="25" cy="18" r="2" fill="#141830"/></svg>`,
  breakout:`<svg viewBox="0 0 40 40"><rect x="4" y="6" width="10" height="5" rx="1.5" fill="#fff"/><rect x="16" y="6" width="10" height="5" rx="1.5" fill="#fff" fill-opacity=".7"/><rect x="28" y="6" width="8" height="5" rx="1.5" fill="#fff" fill-opacity=".5"/><circle cx="20" cy="22" r="3" fill="#fff"/><rect x="11" y="31" width="18" height="4" rx="2" fill="#fff"/></svg>`,
  shooter:`<svg viewBox="0 0 40 40"><path d="M20 4 L26 24 L20 20 L14 24 Z" fill="#fff"/><path d="M17 22 L20 34 L23 22 Z" fill="#fff" fill-opacity=".55"/></svg>`,
  runner:`<svg viewBox="0 0 40 40"><path d="M8 33 L8 22 Q8 13 17 13 L25 13 L25 8 L29 8 L29 13 L31 13 L31 19 L25 19 L25 33 L21 33 L21 26 L14 26 L14 33 Z" fill="#fff"/></svg>`,
  catch:`<svg viewBox="0 0 40 40"><circle cx="14" cy="11" r="5" fill="#fff"/><circle cx="23" cy="7" r="4.5" fill="#fff" fill-opacity=".7"/><circle cx="29" cy="14" r="4" fill="#fff" fill-opacity=".5"/><path d="M5 19 L35 19 L30 34 L10 34 Z" fill="#fff" fill-opacity=".85"/></svg>`,
};

const menuEl = document.getElementById('menu');
GAMES.forEach(g=>{
  const c = document.createElement('div');
  c.className='card';
  c.onclick=()=>openGame(g.id);
  c.innerHTML = `
    <span class="ico" style="background:linear-gradient(145deg, rgba(255,255,255,.18), rgba(0,0,0,.28)), var(${g.color})">${ICONS[g.id]}</span>
    <h3>${g.name}</h3>
    <p>${g.desc}</p>`;
  menuEl.appendChild(c);
});

let currentGame = null; // {stop(), restart()}
const stage = document.getElementById('stage');
const overlay = document.getElementById('overlay');

function openGame(id){
  document.getElementById('menu').parentElement.querySelector('#menu').style.display='none';
  document.querySelector('header.top').style.display='none';
  document.getElementById('gameView').style.display='flex';
  const g = GAMES.find(x=>x.id===id);
  document.getElementById('gTitle').textContent = g.icon+' '+g.name;
  launch(id);
}
function goMenu(){
  if(currentGame && currentGame.stop) currentGame.stop();
  currentGame=null;
  overlay.classList.remove('show');
  document.getElementById('gameView').style.display='none';
  document.getElementById('menu').style.display='grid';
  document.querySelector('header.top').style.display='flex';
  clearStage();
}
function clearStage(){
  [...stage.children].forEach(ch=>{ if(ch.id!=='overlay') ch.remove(); });
}
function setScore(t){ document.getElementById('gScore').textContent=t||''; }
function setHint(t){ document.getElementById('hint').textContent=t||''; }
function showOverlay(title,text,btnLabel){
  document.getElementById('ovTitle').textContent=title;
  document.getElementById('ovText').textContent=text||'';
  document.getElementById('ovBtn').textContent=btnLabel||'Ещё раз';
  overlay.classList.add('show');
}
function hideOverlay(){ overlay.classList.remove('show'); }
function restartCurrent(){ hideOverlay(); if(currentGame && currentGame.restart) currentGame.restart(); }

function launch(id){
  clearStage(); hideOverlay(); setScore(''); setHint('');
  if(currentGame && currentGame.stop) currentGame.stop();
  currentGame = GAME_MODULES[id]();
}

/* helper: create a canvas filling the stage with crisp resolution */
function makeCanvas(vw, vh){
  const canvas=document.createElement('canvas');
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const rect = stage.getBoundingClientRect();
  const scale = Math.min(rect.width/vw, rect.height/vh);
  canvas.width = vw*dpr; canvas.height = vh*dpr;
  canvas.style.width = (vw*scale)+'px';
  canvas.style.height = (vh*scale)+'px';
  stage.insertBefore(canvas, overlay);
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  return {canvas, ctx, vw, vh};
}
function makeDom(){
  const div=document.createElement('div');
  div.style.position='absolute'; div.style.inset='0';
  div.style.display='flex'; div.style.alignItems='center'; div.style.justifyContent='center';
  stage.insertBefore(div, overlay);
  return div;
}

const GAME_MODULES = {};

/* ================= 1. SNAKE ================= */
GAME_MODULES.snake = function(){
  const N=16, VW=320, VH=320, CELL=VW/N;
  const {canvas,ctx} = makeCanvas(VW,VH);
  setHint('Свайп или стрелки — управление');
  let snake, dir, nextDir, food, score, timer, alive, speed;
  function reset(){
    snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];
    dir={x:1,y:0}; nextDir=dir; score=0; alive=true; speed=140;
    placeFood(); setScore('Очки: 0'); loop();
  }
  function placeFood(){
    do{ food={x:(Math.random()*N|0), y:(Math.random()*N|0)}; }
    while(snake.some(s=>s.x===food.x&&s.y===food.y));
  }
  function loop(){
    if(!alive) return;
    dir=nextDir;
    const head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)){
      alive=false; showOverlay('Змейка врезалась','Очки: '+score); return;
    }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){ score++; setScore('Очки: '+score); placeFood(); speed=Math.max(70,speed-3);}
    else snake.pop();
    draw();
    timer=setTimeout(loop, speed);
  }
  function draw(){
    ctx.fillStyle='#0f1330'; ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle='#ff4fa3';
    ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL*0.35,0,7); ctx.fill();
    snake.forEach((s,i)=>{
      ctx.fillStyle = i===0 ? '#4ff3d6' : `rgba(79,243,214,${0.85-i*0.03})`;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2,4) : ctx.rect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
      ctx.fill();
    });
  }
  function setDir(nx,ny){ if(nx===-dir.x&&ny===-dir.y) return; nextDir={x:nx,y:ny}; }
  function key(e){
    if(e.key==='ArrowUp') setDir(0,-1);
    else if(e.key==='ArrowDown') setDir(0,1);
    else if(e.key==='ArrowLeft') setDir(-1,0);
    else if(e.key==='ArrowRight') setDir(1,0);
  }
  let sx,sy;
  function ts(e){ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; }
  function te(e){
    const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0); else setDir(0,dy>0?1:-1);
  }
  window.addEventListener('keydown',key);
  canvas.addEventListener('touchstart',ts);
  canvas.addEventListener('touchend',te);
  reset();
  return {
    stop(){ clearTimeout(timer); window.removeEventListener('keydown',key); },
    restart(){ clearTimeout(timer); reset(); }
  };
};

/* ================= 2. 2048 ================= */
GAME_MODULES['2048'] = function(){
  const dom = makeDom();
  dom.style.flexDirection='column';
  const wrap=document.createElement('div');
  wrap.className='gridwrap';
  wrap.style.gridTemplateColumns='repeat(4,1fr)';
  wrap.style.gridTemplateRows='repeat(4,1fr)';
  wrap.style.width='92%'; wrap.style.height='92%';
  dom.appendChild(wrap);
  const COLORS={2:'#22284f',4:'#242a5a',8:'#4ff3d6',16:'#38e2c4',32:'#ffc24f',64:'#ffab3d',128:'#ff8fbf',256:'#ff4fa3',512:'#c76bff',1024:'#8f7bff',2048:'#4fd1ff'};
  let grid, score;
  function reset(){
    grid=Array.from({length:4},()=>Array(4).fill(0));
    score=0; addTile(); addTile(); setScore('Очки: 0'); render();
  }
  function addTile(){
    const empty=[]; grid.forEach((row,y)=>row.forEach((v,x)=>{if(!v)empty.push([x,y]);}));
    if(!empty.length) return;
    const [x,y]=empty[Math.random()*empty.length|0];
    grid[y][x]=Math.random()<0.9?2:4;
  }
  function render(){
    wrap.innerHTML='';
    grid.forEach(row=>row.forEach(v=>{
      const c=document.createElement('div'); c.className='cell';
      c.style.fontSize= v>512?'18px':'22px';
      c.style.background = v? (COLORS[v]||'#4fd1ff') : 'rgba(255,255,255,0.05)';
      c.style.color = v>4 ? '#0b0e1a' : '#f4f6fb';
      c.textContent = v||'';
      wrap.appendChild(c);
    }));
  }
  function slide(row){
    let arr=row.filter(v=>v);
    for(let i=0;i<arr.length-1;i++){
      if(arr[i]===arr[i+1]){ arr[i]*=2; score+=arr[i]; arr.splice(i+1,1); }
    }
    while(arr.length<4) arr.push(0);
    return arr;
  }
  function rotate(g){ const n=g.map((r,y)=>g.map(row=>row[y]).reverse()); return n; }
  function move(dir){
    let g=grid.map(r=>r.slice());
    let rot=0;
    if(dir==='up') rot=3; else if(dir==='right') rot=2; else if(dir==='down') rot=1;
    for(let i=0;i<rot;i++) g=rotate(g);
    const before=JSON.stringify(g);
    g=g.map(slide);
    let g2=g;
    for(let i=0;i<(4-rot)%4;i++) g2=rotate(g2);
    if(JSON.stringify(g)!==before || true){}
    const changed = JSON.stringify(g2)!==JSON.stringify(grid);
    grid=g2;
    if(changed){ addTile(); setScore('Очки: '+score); render();
      if(!movesLeft()){ showOverlay('Ходов нет','Очки: '+score); }
    }
  }
  function movesLeft(){
    for(let y=0;y<4;y++)for(let x=0;x<4;x++){
      if(!grid[y][x]) return true;
      if(x<3&&grid[y][x]===grid[y][x+1]) return true;
      if(y<3&&grid[y][x]===grid[y+1][x]) return true;
    }
    return false;
  }
  function key(e){
    if(e.key==='ArrowUp') move('up');
    else if(e.key==='ArrowDown') move('down');
    else if(e.key==='ArrowLeft') move('left');
    else if(e.key==='ArrowRight') move('right');
  }
  let sx,sy;
  function ts(e){ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; }
  function te(e){
    const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<20) return;
    if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left'); else move(dy>0?'down':'up');
  }
  window.addEventListener('keydown',key);
  stage.addEventListener('touchstart',ts);
  stage.addEventListener('touchend',te);
  setHint('Свайп или стрелки — сдвиг плиток');
  reset();
  return {
    stop(){ window.removeEventListener('keydown',key); stage.removeEventListener('touchstart',ts); stage.removeEventListener('touchend',te); },
    restart(){ reset(); }
  };
};

/* ================= 3. FLAPPY ================= */
GAME_MODULES.flappy = function(){
  const VW=300, VH=400;
  const {canvas,ctx}=makeCanvas(VW,VH);
  setHint('Тап / пробел — взмах крыльями');
  let bird, pipes, score, alive, vy, raf, spawnT;
  const G=0.35, FLAP=-6, GAP=110, PW=46, SPD=2.4;
  function reset(){
    bird={x:70,y:VH/2,r:12}; vy=0; pipes=[]; score=0; alive=true; spawnT=0;
    setScore('Очки: 0'); last=performance.now(); loop(last);
  }
  let last;
  function flap(){ if(alive) vy=FLAP; }
  function loop(t){
    raf=requestAnimationFrame(loop);
    const dt=Math.min(2,(t-last)/16.67); last=t;
    if(alive){
      vy+=G*dt; bird.y+=vy*dt;
      spawnT-=dt;
      if(spawnT<=0){ spawnT=95; const gy=60+Math.random()*(VH-120-GAP);
        pipes.push({x:VW+20, gy}); }
      pipes.forEach(p=>p.x-=SPD*dt);
      while(pipes.length && pipes[0].x<-PW) { pipes.shift(); score++; setScore('Очки: '+score); }
      pipes.forEach(p=>{
        if(!p.scored && p.x+PW<bird.x){ p.scored=true; }
      });
      if(bird.y-bird.r<0||bird.y+bird.r>VH) end();
      pipes.forEach(p=>{
        if(bird.x+bird.r>p.x && bird.x-bird.r<p.x+PW){
          if(bird.y-bird.r<p.gy || bird.y+bird.r>p.gy+GAP) end();
        }
      });
    }
    draw();
  }
  function end(){ if(!alive) return; alive=false; showOverlay('Разбился!','Очки: '+score); }
  function draw(){
    ctx.fillStyle='#0f1330'; ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle='#4ff3d6';
    pipes.forEach(p=>{
      ctx.fillRect(p.x,0,PW,p.gy);
      ctx.fillRect(p.x,p.gy+GAP,PW,VH-p.gy-GAP);
    });
    ctx.fillStyle='#ffc24f';
    ctx.beginPath(); ctx.arc(bird.x,bird.y,bird.r,0,7); ctx.fill();
  }
  function inp(e){ e.preventDefault(); flap(); }
  canvas.addEventListener('pointerdown',inp);
  function key(e){ if(e.code==='Space') flap(); }
  window.addEventListener('keydown',key);
  reset();
  return {
    stop(){ cancelAnimationFrame(raf); window.removeEventListener('keydown',key); },
    restart(){ cancelAnimationFrame(raf); reset(); }
  };
};

/* ================= 4. TIC TAC TOE (bot + online) ================= */
GAME_MODULES.ttt = function(){
  const dom=makeDom();
  dom.style.flexDirection='column';
  const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let board, over, mode='menu', peer=null, conn=null, isHost=false, myMark, turn, roomCode;

  function winner(b){
    for(const [a,b1,c] of LINES) if(b[a]&&b[a]===b[b1]&&b[a]===b[c]) return b[a];
    return b.includes('')?null:'draw';
  }
  function boardGrid(onClick){
    const wrap=document.createElement('div');
    wrap.className='gridwrap'; wrap.style.gridTemplateColumns='repeat(3,1fr)'; wrap.style.gridTemplateRows='repeat(3,1fr)';
    wrap.style.width='80%'; wrap.style.height='80%';
    board.forEach((v,i)=>{
      const c=document.createElement('div'); c.className='cell'; c.style.fontSize='34px';
      c.textContent=v; c.style.color = v==='❌'?'#4ff3d6':'#ff4fa3';
      c.onclick=()=>onClick(i);
      wrap.appendChild(c);
    });
    return wrap;
  }

  /* ---------- MENU ---------- */
  function showMenu(){
    mode='menu'; cleanupPeer();
    dom.innerHTML='';
    setScore(''); setHint('Выберите режим игры');
    const box=document.createElement('div');
    box.style.display='flex'; box.style.flexDirection='column'; box.style.gap='12px'; box.style.width='78%';
    box.innerHTML=`
      <button class="btn" id="bBot" style="width:100%">🤖 Против бота</button>
      <button class="btn" id="bOnline" style="width:100%;background:linear-gradient(90deg,var(--magenta),var(--amber));color:#0b0e1a">🌐 Онлайн с другом</button>`;
    dom.appendChild(box);
    box.querySelector('#bBot').onclick=startBot;
    box.querySelector('#bOnline').onclick=showOnlineMenu;
  }

  /* ---------- BOT MODE ---------- */
  function startBot(){
    mode='bot'; board=Array(9).fill(''); over=false;
    setScore('Вы: ❌  Бот: ⭕'); setHint('Играйте крестиками против бота · ← Меню');
    renderBot();
  }
  function renderBot(){
    dom.innerHTML=''; dom.appendChild(boardGrid(playerMove));
  }
  function playerMove(i){
    if(over||board[i]) return;
    board[i]='❌'; renderBot();
    const w=winner(board); if(w){ finishBot(w); return; }
    setTimeout(botMove,300);
  }
  function botMove(){
    if(over) return;
    const best=minimax(board,'⭕').index;
    board[best]='⭕'; renderBot();
    const w=winner(board); if(w) finishBot(w);
  }
  function finishBot(w){
    over=true;
    if(w==='draw') showOverlay('Ничья!','');
    else if(w==='❌') showOverlay('Вы победили! 🎉','');
    else showOverlay('Бот победил','Попробуй ещё раз');
  }
  function minimax(b,player){
    const w=winner(b);
    if(w==='❌') return {score:-10};
    if(w==='⭕') return {score:10};
    if(w==='draw') return {score:0};
    const moves=[];
    b.forEach((v,i)=>{ if(!v){
      const nb=b.slice(); nb[i]=player;
      const res=minimax(nb, player==='⭕'?'❌':'⭕');
      moves.push({index:i, score:res.score});
    }});
    if(player==='⭕') return moves.reduce((a,c)=>c.score>a.score?c:a);
    return moves.reduce((a,c)=>c.score<a.score?c:a);
  }

  /* ---------- ONLINE MODE (real P2P via PeerJS, no server needed) ---------- */
  function cleanupPeer(){ try{ if(conn) conn.close(); if(peer) peer.destroy(); }catch(e){} peer=null; conn=null; }
  function showOnlineMenu(){
    mode='online-menu'; dom.innerHTML='';
    setScore(''); setHint('← Меню, чтобы выйти');
    const box=document.createElement('div');
    box.style.display='flex'; box.style.flexDirection='column'; box.style.gap='12px'; box.style.width='82%'; box.style.alignItems='center';
    box.innerHTML=`
      <button class="btn" id="bCreate" style="width:100%">Создать комнату</button>
      <div style="color:var(--sub);font-size:12px">— или —</div>
      <input id="codeIn" placeholder="Код комнаты" maxlength="5" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);text-align:center;text-transform:uppercase;font-size:16px;letter-spacing:2px">
      <button class="btn" id="bJoin" style="width:100%">Присоединиться</button>`;
    dom.appendChild(box);
    box.querySelector('#bCreate').onclick=createRoom;
    box.querySelector('#bJoin').onclick=()=>{ const c=box.querySelector('#codeIn').value.trim(); if(c) joinRoom(c); };
  }
  function waitingScreen(code){
    dom.innerHTML='';
    const box=document.createElement('div');
    box.style.display='flex'; box.style.flexDirection='column'; box.style.gap='10px'; box.style.alignItems='center'; box.style.textAlign='center';
    box.innerHTML=`
      <div style="color:var(--sub);font-size:13px">Код комнаты — отправьте другу:</div>
      <div style="font-size:34px;font-weight:800;letter-spacing:6px;color:var(--cyan)">${code}</div>
      <div style="color:var(--sub);font-size:12.5px">Ожидание соперника…</div>`;
    dom.appendChild(box);
  }
  function connErrorScreen(msg){
    dom.innerHTML='';
    const box=document.createElement('div');
    box.style.display='flex'; box.style.flexDirection='column'; box.style.gap='10px'; box.style.alignItems='center'; box.style.textAlign='center';
    box.innerHTML=`<div style="color:var(--danger);font-weight:700">Не удалось подключиться</div><div style="color:var(--sub);font-size:12.5px">${msg}</div>`;
    dom.appendChild(box);
  }
  function createRoom(){
    dom.innerHTML=''; setHint('← Меню, чтобы отменить');
    roomCode = Math.random().toString(36).substr(2,5).toUpperCase();
    peer = new Peer('arcade10-ttt-'+roomCode);
    peer.on('open', ()=> waitingScreen(roomCode));
    peer.on('connection', c=>{ conn=c; isHost=true; wireConn(); });
    peer.on('error', e=> connErrorScreen('Код занят, попробуйте ещё раз'));
  }
  function joinRoom(code){
    dom.innerHTML='';
    const box=document.createElement('div'); box.style.textAlign='center'; box.style.color='var(--sub)'; box.textContent='Подключение…';
    dom.appendChild(box);
    peer = new Peer();
    peer.on('open', ()=>{
      conn = peer.connect('arcade10-ttt-'+code.trim().toUpperCase());
      conn.on('open', ()=>{ isHost=false; wireConn(); });
    });
    peer.on('error', ()=> connErrorScreen('Комната не найдена или соперник вышел'));
  }
  function wireConn(){
    myMark = isHost?'❌':'⭕'; turn='❌';
    board=Array(9).fill(''); over=false;
    conn.on('data', data=>{
      if(data.type==='move'){ board[data.i]=data.mark; turn = data.mark==='❌'?'⭕':'❌'; renderOnline(); checkOnlineEnd(); }
    });
    conn.on('close', ()=>{ if(!over){ over=true; showOverlay('Соперник отключился',''); } });
    mode='online-play'; renderOnline();
    setScore('Вы: '+myMark);
  }
  function renderOnline(){
    dom.innerHTML='';
    dom.appendChild(boardGrid(onlineMove));
    setHint(over? '' : (turn===myMark? 'Ваш ход' : 'Ход соперника'));
  }
  function onlineMove(i){
    if(over||board[i]||turn!==myMark) return;
    board[i]=myMark; conn.send({type:'move', i, mark:myMark});
    turn = myMark==='❌'?'⭕':'❌';
    renderOnline(); checkOnlineEnd();
  }
  function checkOnlineEnd(){
    const w=winner(board); if(!w) return;
    over=true;
    if(w==='draw') showOverlay('Ничья!','');
    else if(w===myMark) showOverlay('Вы победили! 🎉','');
    else showOverlay('Соперник победил','');
  }

  showMenu();
  return {
    stop(){ cleanupPeer(); },
    restart(){
      if(mode==='bot') startBot();
      else if(mode==='online-play'){ cleanupPeer(); showOnlineMenu(); }
      else showMenu();
    }
  };
};

/* ================= 5. MEMORY ================= */
GAME_MODULES.memory = function(){
  const dom=makeDom();
  const wrap=document.createElement('div');
  wrap.className='gridwrap'; wrap.style.gridTemplateColumns='repeat(4,1fr)'; wrap.style.gridTemplateRows='repeat(3,1fr)';
  wrap.style.width='92%'; wrap.style.height='92%';
  dom.appendChild(wrap);
  const EMO=['🍒','🍋','🍇','🍉','⭐','🔥','🎈','⚡','🍒','🍋','🍇','🍉','⭐','🔥','🎈','⚡'];
  let cards, flipped, matched, moves, lock;
  function reset(){
    const set=['🍒','🍋','🍇','🍉','⭐','🔥'];
    cards=[...set,...set].sort(()=>Math.random()-0.5).map(v=>({v,open:false,done:false}));
    flipped=[]; matched=0; moves=0; lock=false;
    setScore('Ходы: 0'); render();
  }
  function render(){
    wrap.innerHTML='';
    cards.forEach((c,i)=>{
      const el=document.createElement('div'); el.className='cell'; el.style.fontSize='24px';
      el.style.background = c.done? 'rgba(79,243,214,0.25)' : (c.open? '#2a2f57':'rgba(255,255,255,0.05)');
      el.textContent = (c.open||c.done)? c.v : '❔';
      el.onclick=()=>flip(i);
      wrap.appendChild(el);
    });
  }
  function flip(i){
    if(lock||cards[i].open||cards[i].done) return;
    cards[i].open=true; flipped.push(i); render();
    if(flipped.length===2){
      lock=true; moves++; setScore('Ходы: '+moves);
      const [a,b]=flipped;
      if(cards[a].v===cards[b].v){
        cards[a].done=cards[b].done=true; matched++;
        flipped=[]; lock=false; render();
        if(matched===6) showOverlay('Собрано! 🎉','Ходы: '+moves);
      } else {
        setTimeout(()=>{ cards[a].open=cards[b].open=false; flipped=[]; lock=false; render(); },700);
      }
    }
  }
  setHint('Найдите все пары за минимум ходов');
  reset();
  return { stop(){}, restart(){ reset(); } };
};

/* ================= 6. WHACK-A-MOLE ================= */
GAME_MODULES.mole = function(){
  const dom=makeDom();
  const wrap=document.createElement('div');
  wrap.className='gridwrap'; wrap.style.gridTemplateColumns='repeat(3,1fr)'; wrap.style.gridTemplateRows='repeat(3,1fr)';
  wrap.style.width='88%'; wrap.style.height='88%';
  dom.appendChild(wrap);
  let holes, active, score, timeLeft, moleT, clockT, running;
  function reset(){
    holes=Array(9).fill(false); score=0; timeLeft=30; running=true;
    setScore('Очки: 0 · '+timeLeft+'с'); render(); popLoop(); tick();
  }
  function render(){
    wrap.innerHTML='';
    holes.forEach((on,i)=>{
      const c=document.createElement('div'); c.className='cell'; c.style.fontSize='30px';
      c.textContent= on? '🐹':'';
      c.style.background= on? 'rgba(255,194,79,0.25)':'rgba(255,255,255,0.05)';
      c.onclick=()=>hit(i);
      wrap.appendChild(c);
    });
  }
  function hit(i){
    if(!running||!holes[i]) return;
    holes[i]=false; score++; setScore('Очки: '+score+' · '+timeLeft+'с'); render();
  }
  function popLoop(){
    if(!running) return;
    holes=holes.map(()=>false);
    const i=Math.random()*9|0; holes[i]=true; render();
    moleT=setTimeout(popLoop, 500+Math.random()*450);
  }
  function tick(){
    if(!running) return;
    timeLeft--; setScore('Очки: '+score+' · '+timeLeft+'с');
    if(timeLeft<=0){ running=false; clearTimeout(moleT); showOverlay('Время вышло!','Очки: '+score); return; }
    clockT=setTimeout(tick,1000);
  }
  setHint('Тапайте по крысу, пока не кончилось время');
  reset();
  return {
    stop(){ running=false; clearTimeout(moleT); clearTimeout(clockT); },
    restart(){ running=false; clearTimeout(moleT); clearTimeout(clockT); reset(); }
  };
};

/* ================= 7. BREAKOUT ================= */
GAME_MODULES.breakout = function(){
  const VW=300, VH=400;
  const {canvas,ctx}=makeCanvas(VW,VH);
  setHint('Двигайте палец / мышь по горизонтали');
  let paddle, ball, bricks, score, alive, raf, last;
  const PW=64, PH=10, BR_ROWS=4, BR_COLS=6;
  function reset(){
    paddle={x:VW/2-PW/2,y:VH-24,w:PW,h:PH};
    ball={x:VW/2,y:VH-40,r:6,vx:2.4,vy:-3};
    bricks=[];
    const bw=VW/BR_COLS;
    for(let r=0;r<BR_ROWS;r++)for(let c=0;c<BR_COLS;c++)
      bricks.push({x:c*bw+2,y:r*18+30,w:bw-4,h:14,alive:true,
        color:['#4ff3d6','#ffc24f','#ff4fa3','#8f7bff'][r%4]});
    score=0; alive=true; setScore('Очки: 0'); last=performance.now(); loop(last);
  }
  function loop(t){
    raf=requestAnimationFrame(loop);
    const dt=Math.min(2,(t-last)/16.67); last=t;
    if(alive){
      ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
      if(ball.x<ball.r||ball.x>VW-ball.r) ball.vx*=-1;
      if(ball.y<ball.r) ball.vy*=-1;
      if(ball.y+ball.r>paddle.y && ball.y-ball.r<paddle.y+paddle.h && ball.x>paddle.x && ball.x<paddle.x+paddle.w){
        ball.vy=-Math.abs(ball.vy);
        const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
        ball.vx = hit*3.4;
      }
      if(ball.y>VH+20){ alive=false; showOverlay('Мяч упал','Очки: '+score); }
      bricks.forEach(b=>{
        if(!b.alive) return;
        if(ball.x>b.x&&ball.x<b.x+b.w&&ball.y-ball.r<b.y+b.h&&ball.y+ball.r>b.y){
          b.alive=false; ball.vy*=-1; score+=10; setScore('Очки: '+score);
        }
      });
      if(bricks.every(b=>!b.alive)){ alive=false; showOverlay('Победа! 🎉','Очки: '+score); }
    }
    draw();
  }
  function draw(){
    ctx.fillStyle='#0f1330'; ctx.fillRect(0,0,VW,VH);
    bricks.forEach(b=>{ if(b.alive){ ctx.fillStyle=b.color; ctx.fillRect(b.x,b.y,b.w,b.h); }});
    ctx.fillStyle='#f4f6fb'; ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
    ctx.fillStyle='#4ff3d6'; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,7); ctx.fill();
  }
  function moveTo(clientX){
    const r=canvas.getBoundingClientRect();
    const x=(clientX-r.left)/r.width*VW;
    paddle.x = Math.max(0, Math.min(VW-paddle.w, x-paddle.w/2));
  }
  function pm(e){ moveTo(e.touches? e.touches[0].clientX : e.clientX); }
  canvas.addEventListener('touchmove',pm,{passive:true});
  canvas.addEventListener('mousemove',pm);
  reset();
  return { stop(){ cancelAnimationFrame(raf); }, restart(){ cancelAnimationFrame(raf); reset(); } };
};

/* ================= 8. SPACE SHOOTER ================= */
GAME_MODULES.shooter = function(){
  const VW=300, VH=400;
  const {canvas,ctx}=makeCanvas(VW,VH);
  setHint('Двигайте палец / мышь — стрельба автоматическая');
  let ship, bullets, rocks, stars, score, alive, raf, last, shootT, spawnT;
  function reset(){
    ship={x:VW/2,y:VH-36,w:22,h:18}; bullets=[]; rocks=[]; score=0; alive=true; shootT=0; spawnT=0;
    stars=Array.from({length:40},()=>({x:Math.random()*VW,y:Math.random()*VH,r:Math.random()*1.6+.3,s:Math.random()*.6+.2}));
    setScore('Очки: 0'); last=performance.now(); loop(last);
  }
  function loop(t){
    raf=requestAnimationFrame(loop);
    const dt=Math.min(2,(t-last)/16.67); last=t;
    if(alive){
      stars.forEach(s=>{ s.y+=s.s*dt; if(s.y>VH){ s.y=0; s.x=Math.random()*VW; } });
      shootT-=dt; if(shootT<=0){ shootT=14; bullets.push({x:ship.x,y:ship.y-14}); }
      bullets.forEach(b=>b.y-=6*dt);
      bullets=bullets.filter(b=>b.y>-10);
      spawnT-=dt; if(spawnT<=0){ spawnT=42-Math.min(25,score/3); rocks.push({x:Math.random()*(VW-24)+12,y:-14,r:9+Math.random()*8,vy:1.4+Math.random()*1.6}); }
      rocks.forEach(r=>r.y+=r.vy*dt);
      rocks=rocks.filter(r=>{
        if(r.y-r.r>VH) return false;
        if(Math.abs(r.x-ship.x)<r.r+10 && Math.abs(r.y-ship.y)<r.r+8){ end(); }
        return true;
      });
      bullets.forEach(b=>{
        rocks.forEach(r=>{
          if(r.hit) return;
          if(Math.hypot(b.x-r.x,b.y-r.y)<r.r+3){ r.hit=true; b.y=-999; score+=5; setScore('Очки: '+score); }
        });
      });
      rocks=rocks.filter(r=>!r.hit);
    }
    draw();
  }
  function end(){ if(!alive) return; alive=false; showOverlay('Корабль разбит','Очки: '+score); }
  function draw(){
    ctx.fillStyle='#0b0e24'; ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle='#ffffff';
    stars.forEach(s=>{ ctx.globalAlpha=.5+s.r/2; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill(); });
    ctx.globalAlpha=1;
    ctx.fillStyle='#ffc24f';
    rocks.forEach(r=>{ ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,7); ctx.fill(); });
    ctx.fillStyle='#4ff3d6';
    bullets.forEach(b=>ctx.fillRect(b.x-1.5,b.y,3,10));
    ctx.fillStyle='#ff4fa3';
    ctx.beginPath();
    ctx.moveTo(ship.x,ship.y-10); ctx.lineTo(ship.x+11,ship.y+9); ctx.lineTo(ship.x,ship.y+4); ctx.lineTo(ship.x-11,ship.y+9);
    ctx.closePath(); ctx.fill();
  }
  function moveTo(clientX){
    const r=canvas.getBoundingClientRect();
    const x=(clientX-r.left)/r.width*VW;
    ship.x=Math.max(14,Math.min(VW-14,x));
  }
  function pm(e){ moveTo(e.touches? e.touches[0].clientX : e.clientX); }
  canvas.addEventListener('touchmove',pm,{passive:true});
  canvas.addEventListener('mousemove',pm);
  reset();
  return { stop(){ cancelAnimationFrame(raf); }, restart(){ cancelAnimationFrame(raf); reset(); } };
};

/* ================= 9. RUNNER ================= */
GAME_MODULES.runner = function(){
  const VW=320, VH=320;
  const {canvas,ctx}=makeCanvas(VW,VH);
  setHint('Тап / пробел — прыжок');
  const GROUND=VH-40;
  let dino, obstacles, vy, speed, score, alive, raf, last, spawnT;
  function reset(){
    dino={x:36,y:GROUND-24,w:22,h:24}; vy=0; obstacles=[]; speed=3.4; score=0; alive=true; spawnT=60;
    setScore('Очки: 0'); last=performance.now(); loop(last);
  }
  function jump(){ if(alive && dino.y>=GROUND-dino.h-0.5) vy=-8; }
  function loop(t){
    raf=requestAnimationFrame(loop);
    const dt=Math.min(2,(t-last)/16.67); last=t;
    if(alive){
      vy+=0.42*dt; dino.y+=vy*dt;
      if(dino.y>GROUND-dino.h){ dino.y=GROUND-dino.h; vy=0; }
      speed+=0.0009*dt; score+=dt*0.12|0 ? 1:0;
      spawnT-=dt;
      if(spawnT<=0){ spawnT=55+Math.random()*45; obstacles.push({x:VW+10,w:14+Math.random()*10,h:20+Math.random()*20}); }
      obstacles.forEach(o=>o.x-=speed*dt);
      while(obstacles.length && obstacles[0].x<-30){ obstacles.shift(); score+=5; }
      setScore('Очки: '+Math.floor(score));
      obstacles.forEach(o=>{
        if(dino.x+dino.w>o.x && dino.x<o.x+o.w && dino.y+dino.h>GROUND-o.h){ end(); }
      });
    }
    draw();
  }
  function end(){ if(!alive) return; alive=false; showOverlay('Столкновение!','Очки: '+Math.floor(score)); }
  function draw(){
    ctx.fillStyle='#0f1330'; ctx.fillRect(0,0,VW,VH);
    ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(VW,GROUND); ctx.stroke();
    ctx.fillStyle='#4ff3d6'; ctx.fillRect(dino.x,dino.y,dino.w,dino.h);
    ctx.fillStyle='#ff4fa3';
    obstacles.forEach(o=> ctx.fillRect(o.x,GROUND-o.h,o.w,o.h));
  }
  function inp(e){ e.preventDefault(); jump(); }
  canvas.addEventListener('pointerdown',inp);
  function key(e){ if(e.code==='Space') jump(); }
  window.addEventListener('keydown',key);
  reset();
  return {
    stop(){ cancelAnimationFrame(raf); window.removeEventListener('keydown',key); },
    restart(){ cancelAnimationFrame(raf); reset(); }
  };
};

/* ================= 10. FRUIT CATCH ================= */
GAME_MODULES.catch = function(){
  const VW=300, VH=400;
  const {canvas,ctx}=makeCanvas(VW,VH);
  setHint('Двигайте палец / мышь — ловите фрукты, объезжайте бомбы 💣');
  const FRUITS=[['#ff4fa3',6],['#ffc24f',6],['#4ff3d6',6],['#8f7bff',6]];
  let basket, items, score, lives, alive, raf, last, spawnT;
  function reset(){
    basket={x:VW/2,w:52,h:12,y:VH-22}; items=[]; score=0; lives=3; alive=true; spawnT=0;
    setScore('Очки: 0 · ❤️❤️❤️'); last=performance.now(); loop(last);
  }
  function heartsStr(){ return '❤️'.repeat(Math.max(0,lives)); }
  function loop(t){
    raf=requestAnimationFrame(loop);
    const dt=Math.min(2,(t-last)/16.67); last=t;
    if(alive){
      spawnT-=dt;
      if(spawnT<=0){
        spawnT=38-Math.min(20,score/6);
        const bomb=Math.random()<0.22;
        const f=FRUITS[Math.random()*FRUITS.length|0];
        items.push({x:Math.random()*(VW-20)+10,y:-12,vy:1.6+Math.random()*1.6+score*0.01,r:bomb?9:f[1],bomb,color:bomb?'#2b2f45':f[0]});
      }
      items.forEach(it=>it.y+=it.vy*dt);
      items=items.filter(it=>{
        if(it.y-it.r>VH) { if(!it.bomb){ lives--; setScore('Очки: '+score+' · '+heartsStr()); if(lives<=0) end(); } return false; }
        if(Math.abs(it.x-basket.x)<basket.w/2+it.r && it.y+it.r>basket.y && it.y-it.r<basket.y+basket.h){
          if(it.bomb){ lives--; setScore('Очки: '+score+' · '+heartsStr()); if(lives<=0) end(); }
          else { score+=10; setScore('Очки: '+score+' · '+heartsStr()); }
          return false;
        }
        return true;
      });
    }
    draw();
  }
  function end(){ if(!alive) return; alive=false; showOverlay('Корзина пуста','Очки: '+score); }
  function draw(){
    ctx.fillStyle='#101532'; ctx.fillRect(0,0,VW,VH);
    items.forEach(it=>{
      ctx.fillStyle=it.color;
      ctx.beginPath(); ctx.arc(it.x,it.y,it.r,0,7); ctx.fill();
      if(it.bomb){ ctx.strokeStyle='#ff5c6c'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(it.x,it.y-it.r); ctx.lineTo(it.x+4,it.y-it.r-6); ctx.stroke(); }
    });
    ctx.fillStyle='#c76b3d';
    ctx.beginPath();
    ctx.moveTo(basket.x-basket.w/2,basket.y);
    ctx.lineTo(basket.x+basket.w/2,basket.y);
    ctx.lineTo(basket.x+basket.w/2-6,basket.y+basket.h);
    ctx.lineTo(basket.x-basket.w/2+6,basket.y+basket.h);
    ctx.closePath(); ctx.fill();
  }
  function moveTo(clientX){
    const r=canvas.getBoundingClientRect();
    const x=(clientX-r.left)/r.width*VW;
    basket.x=Math.max(basket.w/2,Math.min(VW-basket.w/2,x));
  }
  function pm(e){ moveTo(e.touches? e.touches[0].clientX : e.clientX); }
  canvas.addEventListener('touchmove',pm,{passive:true});
  canvas.addEventListener('mousemove',pm);
  reset();
  return { stop(){ cancelAnimationFrame(raf); }, restart(){ cancelAnimationFrame(raf); reset(); } };
};
